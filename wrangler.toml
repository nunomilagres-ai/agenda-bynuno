name = "agenda-bynuno"
compatibility_date = "2026-02-20"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "agenda-bynuno-db"
database_id = "c04352ba-bfa7-4926-ac2c-2f99927c8b52"

# Anexos de notas (PDF, fotos, etc.) — bucket criado automaticamente pelo
# workflow de deploy (ver .github/workflows/deploy.yml), tal como a D1 acima.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "agenda-bynuno-attachments"

[vars]
APP_URL = "https://agenda.bynuno.com"
