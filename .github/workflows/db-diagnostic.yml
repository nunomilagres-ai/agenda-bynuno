name: Diagnóstico da base de dados (manual)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Consultar contagens e eventos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          echo "--- users ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT id, email, created_date FROM users;"
          echo "--- locations (contagem) ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT count(*) AS n FROM locations;"
          echo "--- locations ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT id, user_id, name, color, created_date FROM locations;"
          echo "--- location_periods (contagem) ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT count(*) AS n FROM location_periods;"
          echo "--- events (contagem) ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT count(*) AS n FROM events;"
          echo "--- events ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT id, user_id, title, start_datetime, end_datetime, recurrence_freq, recurrence_until, event_type, created_date FROM events ORDER BY created_date;"
          echo "--- event_exceptions (contagem) ---"
          npx wrangler d1 execute agenda-bynuno-db --remote --command "SELECT count(*) AS n FROM event_exceptions;"
